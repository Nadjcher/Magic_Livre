<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="etoile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#fond)"/>

  <!-- Livre ouvert -->
  <g transform="translate(256 300)">
    <!-- page gauche -->
    <path d="M-150 -70 C-110 -95 -40 -95 0 -70 L0 70 C-40 45 -110 45 -150 70 Z"
          fill="#FFFBF2"/>
    <!-- page droite -->
    <path d="M150 -70 C110 -95 40 -95 0 -70 L0 70 C40 45 110 45 150 70 Z"
          fill="#FFF3DC"/>
    <!-- reliure -->
    <path d="M0 -70 L0 70" stroke="#C4B5FD" stroke-width="6" stroke-linecap="round"/>
    <!-- lignes de texte -->
    <g stroke="#C4B5FD" stroke-width="7" stroke-linecap="round" opacity="0.8">
      <path d="M-120 -40 L-35 -40"/>
      <path d="M-120 -10 L-35 -10"/>
      <path d="M-120 20 L-45 20"/>
      <path d="M35 -40 L120 -40"/>
      <path d="M35 -10 L120 -10"/>
      <path d="M45 20 L120 20"/>
    </g>
  </g>

  <!-- Grande étoile magique -->
  <path transform="translate(256 120)"
        d="M0 -58 L16 -16 L58 0 L16 16 L0 58 L-16 16 L-58 0 L-16 -16 Z"
        fill="url(#etoile)"/>
  <!-- petites étincelles -->
  <circle cx="150" cy="150" r="12" fill="#FDE68A"/>
  <circle cx="372" cy="170" r="9" fill="#FDE68A"/>
</svg>
