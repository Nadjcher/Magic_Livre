<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-SemiBold.ttf"); font-weight: 600; }
      :root { --nuit: #0f1a44; --bleu: #1e2c74; --rose: #ffc8ea; --ink: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--nuit); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Nunito", sans-serif; color: var(--ink);
        background: linear-gradient(180deg, #1b2868 0%, #24358c 55%, #16245c 100%); }
      .plein { position: absolute; inset: 0; }
      .titre { position: absolute; left: 90px; right: 90px; font-family: "Fraunces", serif; font-weight: 600; text-align: center; line-height: 1.08; text-shadow: 0 6px 30px rgba(5,10,40,.55); }
      .legende { position: absolute; left: 80px; right: 80px; top: 1080px; text-align: center; font-size: 64px; font-weight: 800; line-height: 1.15;
        padding: 22px 30px; border-radius: 28px; background: rgba(11,18,54,.78); }
      .page { position: absolute; left: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .page img { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .voile { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,18,54,.0) 40%, rgba(11,18,54,.55) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">

      <!-- 0–2,8 s : l'accroche, la photo envoyée -->
      <div id="accroche" class="clip plein" data-start="0" data-duration="2.8" data-track-index="1">
        <h1 id="accroche-titre" class="titre" style="top: 250px; font-size: 104px;">J'ai envoyé<br/>UNE photo…</h1>
        <div id="polaroid" style="position:absolute; left:290px; top:640px; width:500px; padding:22px 22px 90px; background:#fff; border-radius:10px; box-shadow:0 30px 60px rgba(5,10,40,.6);">
          <img src="assets/photo.webp" style="width:456px; height:600px; object-fit:cover; display:block;" />
          <p style="position:absolute; left:0; right:0; bottom:26px; text-align:center; font-family:'Fraunces',serif; font-size:40px; color:#0f1a44; font-style:italic;">Léo, 5 ans</p>
        </div>
      </div>

      <!-- 2,8–5,6 s : la couverture -->
      <div id="couv" class="clip plein" data-start="2.8" data-duration="2.8" data-track-index="2">
        <div id="couv-livre" style="position:absolute; left:120px; top:420px; width:840px; height:1060px; border-radius:10px 26px 26px 10px; overflow:hidden; box-shadow:0 40px 80px rgba(5,10,40,.7);">
          <img src="assets/couverture.webp" style="position:absolute; left:50%; top:0; height:100%; transform:translateX(-50%);" />
          <div class="voile"></div>
          <p style="position:absolute; left:40px; right:40px; bottom:56px; font-family:'Fraunces',serif; font-size:70px; line-height:1.05;">Le hoquet doré de la nuit de Noël</p>
        </div>
        <h1 id="couv-titre" class="titre" style="top: 210px; font-size: 92px;">…et voilà SON livre</h1>
      </div>

      <!-- 5,6–11,6 s : trois pages, 2 s chacune -->
      <div id="p1" class="clip page" data-start="5.6" data-duration="2" data-track-index="3"><img id="p1-img" src="assets/00.webp" style="object-position: 38% 50%;" /><div class="voile"></div>
        <p id="p1-txt" class="legende">La veille de Noël, Léo ne dort pas…</p></div>
      <div id="p2" class="clip page" data-start="7.6" data-duration="2" data-track-index="3"><img id="p2-img" src="assets/06.webp" style="object-position: 45% 50%;" /><div class="voile"></div>
        <p id="p2-txt" class="legende">Il sauve le renne de Noël</p></div>
      <div id="p3" class="clip page" data-start="9.6" data-duration="2" data-track-index="3"><img id="p3-img" src="assets/07.webp" style="object-position: 50% 50%;" /><div class="voile"></div>
        <p id="p3-txt" class="legende">Et donne le départ du traîneau !</p></div>

      <!-- 11,6–15 s : l'écran final -->
      <div id="fin" class="clip plein" data-start="11.6" data-duration="3.4" data-track-index="4">
        <h1 id="fin-titre" class="titre" style="top: 330px; font-size: 96px;">Son prénom.<br/>Son visage.<br/>Son histoire.</h1>
        <p id="fin-sous" style="position:absolute; left:90px; right:90px; top:860px; text-align:center; font-size:56px; font-weight:700; color:var(--rose);">Lu gratuitement avant d'acheter</p>
        <p id="fin-url" style="position:absolute; left:90px; right:90px; top:1010px; text-align:center; font-size:58px; font-weight:800; padding:26px; border-radius:999px; background:#4a5ee8;">encoreunehistoire.fr</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Accroche : déjà lisible à l'image 0 (miniature TikTok), petit mouvement.
      tl.fromTo("#accroche-titre", { y: 0, opacity: 1 }, { y: -10, duration: 2.8, ease: "none" }, 0);
      tl.fromTo("#polaroid", { rotation: -6, scale: 1 }, { rotation: -2, scale: 1.04, duration: 2.6, ease: "power2.out" }, 0);
      // Couverture : arrive et grossit doucement.
      tl.fromTo("#couv-livre", { scale: 0.86, opacity: 0, y: 60 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.8);
      tl.to("#couv-livre", { scale: 1.05, duration: 2.3, ease: "none" }, 3.25);
      tl.fromTo("#couv-titre", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.95);
      // Pages : léger zoom (effet Ken Burns) et légende qui monte.
      [["#p1", 5.6], ["#p2", 7.6], ["#p3", 9.6]].forEach(([id, t]) => {
        tl.fromTo(id + "-img", { scale: 1.0 }, { scale: 1.09, duration: 2, ease: "none" }, t);
        tl.fromTo(id + "-txt", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t + 0.1);
      });
      // Fin : les trois lignes, puis l'adresse.
      tl.fromTo("#fin-titre", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 11.65);
      tl.fromTo("#fin-sous", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 12.2);
      tl.fromTo("#fin-url", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 12.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
